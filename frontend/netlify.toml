[build]
  command = "npm run build"
  publish = "build"

# Redirect API calls to GCP Cloud Run backend
[[redirects]]
  from = "/api/*"
  to = "https://debbie-ta-web-27459188081.us-central1.run.app/api/:splat"
  status = 200
  force = true

# SPA fallback - serve index.html for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
  REACT_APP_API_URL = "https://debbie-ta-web-27459188081.us-central1.run.app"
